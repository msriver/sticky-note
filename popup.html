<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PagePin</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="stn-popup">
      <div class="stn-row stn-toggle-row">
        <span class="stn-title" data-i18n="popupEnable"></span>
        <label class="stn-switch">
          <input type="checkbox" id="enabledToggle" />
          <span class="stn-slider"></span>
        </label>
      </div>

      <div class="stn-status" id="status" role="status" aria-live="polite"></div>

      <button class="stn-btn stn-btn-primary" id="addBtn" data-i18n="popupAdd"></button>
      <button class="stn-btn" id="clearBtn" data-i18n="popupClear"></button>

      <p class="stn-hint" data-i18n="popupHint"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
