<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9d6"/>
      <stop offset="55%" stop-color="#ffe9c6"/>
      <stop offset="100%" stop-color="#ffd9e8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- scattered mini notes -->
  <g filter="url(#shadow)">
    <rect x="70" y="200" width="90" height="80" rx="6" fill="#c9f0ff" transform="rotate(-8 115 240)"/>
    <rect x="1020" y="40" width="90" height="80" rx="6" fill="#d6ffd6" transform="rotate(10 1065 80)"/>
    <rect x="960" y="210" width="90" height="80" rx="6" fill="#ffd6e8" transform="rotate(-6 1005 250)"/>
    <rect x="110" y="40" width="90" height="80" rx="6" fill="#e0d6ff" transform="rotate(7 155 80)"/>
  </g>

  <!-- title note -->
  <g filter="url(#shadow)">
    <rect x="330" y="70" width="540" height="180" rx="10" fill="#fff6a9" transform="rotate(-1.5 600 160)"/>
  </g>
  <g transform="rotate(-1.5 600 160)">
    <circle cx="365" cy="102" r="6" fill="#f7b500"/>
    <circle cx="384" cy="102" r="6" fill="#ff9ecb"/>
    <circle cx="403" cy="102" r="6" fill="#7fd6ff"/>
    <text x="330" y="165" text-anchor="middle" transform="translate(270 0)" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif" font-size="40" font-weight="700" fill="#3a3a3a">PagePin</text>
    <text x="330" y="205" text-anchor="middle" transform="translate(270 0)" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#5c5c5c">웹 페이지 위에 포스트잇처럼 메모를 남기세요</text>
  </g>
</svg>
