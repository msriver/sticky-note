<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="600" fill="#eef0f3"/>

  <!-- browser window -->
  <g filter="url(#winShadow)">
    <rect x="30" y="30" width="900" height="540" rx="12" fill="#ffffff"/>
    <!-- title bar -->
    <rect x="30" y="30" width="900" height="44" rx="12" fill="#e7e7ea"/>
    <rect x="30" y="62" width="900" height="12" fill="#e7e7ea"/>
    <circle cx="56" cy="52" r="6" fill="#ff5f57"/>
    <circle cx="76" cy="52" r="6" fill="#febc2e"/>
    <circle cx="96" cy="52" r="6" fill="#28c840"/>
    <rect x="140" y="42" width="560" height="20" rx="10" fill="#ffffff"/>
    <text x="160" y="57" font-family="'Segoe UI', sans-serif" font-size="13" fill="#7a7a7a">https://example.com/articles/deep-work</text>
    <!-- extension icon in toolbar -->
    <rect x="850" y="40" width="24" height="24" rx="6" fill="#fff6a9" stroke="#e8dd7f"/>
    <text x="862" y="58" text-anchor="middle" font-family="sans-serif" font-size="14">📝</text>
  </g>

  <!-- page content -->
  <g>
    <rect x="80" y="110" width="480" height="26" rx="4" fill="#3a3a3a" opacity="0.85"/>
    <rect x="80" y="150" width="700" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="172" width="700" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="194" width="620" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="230" width="700" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="252" width="700" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="274" width="540" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="310" width="700" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="332" width="660" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="354" width="700" height="12" rx="4" fill="#c9c9c9"/>
    <rect x="80" y="376" width="480" height="12" rx="4" fill="#c9c9c9"/>
  </g>

  <!-- note 1 (yellow) -->
  <g filter="url(#cardShadow)" transform="rotate(-3 300 480)">
    <rect x="200" y="410" width="220" height="150" rx="6" fill="#fff6a9"/>
  </g>
  <g transform="rotate(-3 300 480)">
    <circle cx="222" cy="428" r="6" fill="#fff6a9" stroke="#00000026"/>
    <circle cx="238" cy="428" r="6" fill="#ffd6e8" stroke="#00000026"/>
    <circle cx="254" cy="428" r="6" fill="#c9f0ff" stroke="#00000026"/>
    <text x="404" y="433" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#8a8a8a">×</text>
    <text x="216" y="460" font-family="'Segoe UI', sans-serif" font-size="14" fill="#3a3a3a">이 문단 핵심 정리:</text>
    <text x="216" y="480" font-family="'Segoe UI', sans-serif" font-size="14" fill="#3a3a3a">몰입은 환경 설계에서</text>
    <text x="216" y="500" font-family="'Segoe UI', sans-serif" font-size="14" fill="#3a3a3a">시작된다.</text>
    <path d="M406 546 L416 546 L416 536" stroke="#00000066" stroke-width="2" fill="none"/>
  </g>

  <!-- note 2 (pink) -->
  <g filter="url(#cardShadow)" transform="rotate(4 690 250)">
    <rect x="600" y="180" width="180" height="130" rx="6" fill="#ffd6e8"/>
  </g>
  <g transform="rotate(4 690 250)">
    <circle cx="618" cy="196" r="6" fill="#fff6a9" stroke="#00000026"/>
    <circle cx="634" cy="196" r="6" fill="#ffd6e8" stroke="#00000026"/>
    <circle cx="650" cy="196" r="6" fill="#c9f0ff" stroke="#00000026"/>
    <text x="764" y="201" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#8a8a8a">×</text>
    <text x="614" y="228" font-family="'Segoe UI', sans-serif" font-size="14" fill="#3a3a3a">나중에 인용할 문장</text>
    <text x="614" y="248" font-family="'Segoe UI', sans-serif" font-size="14" fill="#3a3a3a">👀</text>
  </g>

  <!-- note 3 (blue), small -->
  <g filter="url(#cardShadow)" transform="rotate(-6 690 470)">
    <rect x="630" y="420" width="150" height="100" rx="6" fill="#c9f0ff"/>
  </g>
  <g transform="rotate(-6 690 470)">
    <circle cx="646" cy="434" r="5" fill="#fff6a9" stroke="#00000026"/>
    <circle cx="660" cy="434" r="5" fill="#ffd6e8" stroke="#00000026"/>
    <circle cx="674" cy="434" r="5" fill="#c9f0ff" stroke="#00000026"/>
    <text x="764" y="439" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8a8a">×</text>
    <text x="644" y="465" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3a3a3a">TODO: 출처 찾기</text>
  </g>
</svg>
